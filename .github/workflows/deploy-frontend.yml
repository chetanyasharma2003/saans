name: 🚀 Deploy Frontend to Vercel

on:
  push:
    branches: [main, develop]
    paths:
      - 'saans-web/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './saans-web/package-lock.json'

      - name: 📚 Install dependencies
        run: npm ci
        working-directory: saans-web

      - name: ✨ Type check
        run: npm run type-check || true
        working-directory: saans-web

      - name: 🏗️ Build
        run: npm run build
        working-directory: saans-web
        env:
          VITE_API_URL: https://saans-backend-tt8p.onrender.com

      - name: 🚀 Deploy to Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != '' && env.VERCEL_ORG_ID != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: saans-web
          production: true
        env:
          VITE_API_URL: https://saans-backend-tt8p.onrender.com

      - name: ⚠️ Vercel secrets missing
        if: env.VERCEL_TOKEN == '' || env.VERCEL_PROJECT_ID == '' || env.VERCEL_ORG_ID == ''
        run: echo "⚠️ VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets not configured in GitHub"

      - name: ✅ Deployment successful
        if: success()
        run: echo "✅ Frontend deployed to Vercel successfully!"

      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment failed. Check logs above."
          exit 1
