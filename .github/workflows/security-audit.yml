name: Security Audit

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run npm audit (Backend)
        run: cd saans-api && npm audit --audit-level=high || true

      - name: Run npm audit (Frontend)
        run: cd saans-web && npm audit --audit-level=high || true

      - name: Check for hardcoded secrets
        run: |
          # Look for actual hardcoded credential assignments (not env variable references)
          # Patterns: password = "...", SECRET_KEY: "...", token: "...", etc
          if grep -rE '(password|secret|token|apiKey)\s*[:=]\s*["\x27][A-Za-z0-9/+=_-]{8,}["\x27]' saans-api/src saans-web/src --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v "process\.env\|import\|//"; then
            echo "⚠️ Potential hardcoded secrets found"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
