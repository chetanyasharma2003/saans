name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    working-directory: ./saans-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'saans-web/package-lock.json'

      - run: cd saans-web && npm ci

      - run: cd saans-web && npm run lint 2>/dev/null || true

      - run: cd saans-web && npm run test:unit

      - run: cd saans-web && npm run test:coverage

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./saans-web/coverage/coverage-final.json
          flags: frontend

  backend-tests:
    runs-on: ubuntu-latest
    working-directory: ./server

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: saans_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - run: cd server && npm ci

      - run: cd server && npm run lint 2>/dev/null || true

      - run: cd server && npm run test:unit
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/saans_test
          NODE_ENV: test

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: cd saans-web && npm ci

      - run: cd saans-web && npx cypress run --headless
        env:
          CYPRESS_BASE_URL: http://localhost:3000

  build:
    needs: [frontend-tests, backend-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - run: cd saans-web && npm ci && npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: saans-web/dist

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: npm audit --audit-level=moderate
        working-directory: ./saans-web

      - run: npm audit --audit-level=moderate
        working-directory: ./server

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, security-scan]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: vercel/action@master
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./saans-web

      - name: Deploy to Render
        run: |
          curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}
