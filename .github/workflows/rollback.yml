name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rollback'
        required: true
        type: choice
        options:
          - frontend
          - backend
          - both

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Rollback Frontend
        if: ${{ github.event.inputs.service == 'frontend' || github.event.inputs.service == 'both' }}
        run: |
          echo "Rolling back Vercel frontend..."
          # Vercel auto-keeps previous builds, manual rollback if needed
          echo "Frontend rollback: Revert to previous commit and re-deploy"

      - name: Rollback Backend
        if: ${{ github.event.inputs.service == 'backend' || github.event.inputs.service == 'both' }}
        run: |
          echo "Rolling back Render backend..."
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/rollback" \
            -H "accept: application/json" \
            -H "authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
