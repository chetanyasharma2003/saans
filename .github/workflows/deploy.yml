name: Validate SAANS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            saans-web/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Install frontend dependencies
        run: npm ci
        working-directory: saans-web

      - name: Check backend syntax
        run: |
          node --check server.js
          node --check config/database.js
          node --check routes/resources-pg.routes.js
        working-directory: server

      - name: Build backend
        run: npm run build
        working-directory: server

      - name: Build frontend
        run: npm run build
        working-directory: saans-web
        env:
          VITE_API_URL: https://saans-backend-tt8p.onrender.com
