name: 🚀 Deploy Backend to Render

on:
  push:
    branches: [main, develop]
    paths:
      - 'saans-api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './saans-api/package-lock.json'

      - name: 📚 Install dependencies
        run: cd saans-api && npm ci

      - name: 🔄 Generate Prisma types
        run: cd saans-api && npx prisma generate

      - name: ✨ Type check
        run: cd saans-api && npm run type-check || true

      - name: 🏗️ Build
        run: cd saans-api && npm run build || true

      - name: 🔑 Trigger Render deployment
        run: |
          curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}
        continue-on-error: true

      - name: 💾 Push to Render
        run: |
          git remote add render https://git.render.com/git/srv-${{ secrets.RENDER_SERVICE_ID }}.git || true
          git push render main:main || git push render develop:main
        env:
          GIT_AUTHOR_NAME: chetanyasharma2003
          GIT_AUTHOR_EMAIL: chetanyaprakashsharma2003@gmail.com
          GIT_COMMITTER_NAME: chetanyasharma2003
          GIT_COMMITTER_EMAIL: chetanyaprakashsharma2003@gmail.com
        continue-on-error: true

      - name: ✅ Deployment triggered
        run: echo "✅ Backend deployment to Render triggered!"

      - name: 📝 Deployment info
        run: |
          echo "Backend URL: https://saans-backend-ti8p.onrender.com"
          echo "Deployment may take 2-5 minutes to complete"

      - name: ⚠️ Render secrets check
        if: ${{ secrets.RENDER_SERVICE_ID == '' || secrets.RENDER_DEPLOY_KEY == '' }}
        run: echo "⚠️ RENDER_SERVICE_ID or RENDER_DEPLOY_KEY secrets not configured - deployment may have skipped"
