name: Validate Backend for Render

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'package.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Check backend syntax
        run: |
          node --check server.js
          node --check config/database.js
          node --check routes/resources-pg.routes.js
        working-directory: server

      - name: Build backend
        run: npm run build
        working-directory: server

      - name: Deploy backend to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_SERVICE_ID" ]]; then
            echo "Render deployment secrets are not configured."
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${EXPECTED_COMMIT}\",\"clearCache\":\"do_not_clear\"}" \
            -w '\n%{http_code}')"
          http_status="${response##*$'\n'}"
          response_body="${response%$'\n'*}"
          deploy_id="$(jq -r '.id // empty' <<< "$response_body")"
          if [[ "$http_status" != "201" && "$http_status" != "202" ]]; then
            echo "Render returned unexpected HTTP status: $http_status"
            exit 1
          fi

          for attempt in $(seq 1 60); do
            if [[ -z "$deploy_id" ]]; then
              deployments="$(curl --fail --silent --show-error \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=20" \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                -H "Accept: application/json")"
              deploy_id="$(jq -r --arg commit "$EXPECTED_COMMIT" \
                '[.[] | select(.deploy.commit.id == $commit) | .deploy.id][0] // empty' \
                <<< "$deployments")"
            fi
            if [[ -z "$deploy_id" ]]; then
              sleep 10
              continue
            fi

            deployment="$(curl --fail --silent --show-error \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json")"
            status="$(jq -r '.status // empty' <<< "$deployment")"
            echo "Render deployment status: ${status:-unknown}"

            case "$status" in
              live)
                curl --fail --silent --show-error https://saans-backend-tt8p.onrender.com/api/health
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled)
                echo "Render deployment failed with status: $status"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for the Render deployment to become live."
          exit 1

      - name: Confirm Render is healthy
        run: curl --fail --silent --show-error https://saans-backend-tt8p.onrender.com/api/health
