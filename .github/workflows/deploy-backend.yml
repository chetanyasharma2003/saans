name: Validate Backend for Render

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'package.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Check backend syntax
        run: |
          node --check server.js
          node --check config/database.js
          node --check routes/resources-pg.routes.js
        working-directory: server

      - name: Build backend
        run: npm run build
        working-directory: server

      - name: Confirm Render is healthy
        run: curl --fail --silent --show-error https://saans-backend-tt8p.onrender.com/api/health
